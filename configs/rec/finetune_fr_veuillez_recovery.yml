Global:
  debug: false
  use_gpu: true
  epoch_num: 1
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: e:/OCR_Project/PaddleOCR/output/rec_fr_veuillez_recovery_tight
  save_epoch_step: 1
  eval_batch_step: [0, 1275]
  cal_metric_during_train: true
  pretrained_model: e:/OCR_Project/PaddleOCR/output/rec_fr_synth_timer_20260529/best_accuracy
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: e:/OCR_Project/data/rec_dataset_fr_veuillez_recovery_tight/ppocr_keys.txt
  max_text_length: 64
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: e:/OCR_Project/PaddleOCR/output/rec_fr_veuillez_recovery_tight/predicts.txt
  use_amp: true
  amp_level: O2

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.000003
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 0.00003

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 120
    depth: 2
    hidden_dims: 120
    kernel_size: [1, 3]
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: e:/OCR_Project
    label_file_list:
      - e:/OCR_Project/data/rec_dataset_fr_veuillez_recovery_tight/rec_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 0
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: e:/OCR_Project
    label_file_list:
      - e:/OCR_Project/data/rec_dataset_fr_veuillez_recovery_tight/rec_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 0
    use_shared_memory: false

profiler_options: